<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BookNest</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-indigo-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-4
                    flex justify-between items-center">

            <a href="index.html"
               class="text-2xl font-bold">
                📚 BookNest
            </a>

            <div class="flex gap-6">

                <a href="index.html"
                   class="hover:text-yellow-300">
                    Home
                </a>

                <a href="books.html"
                   class="hover:text-yellow-300">
                    Books
                </a>

                <a href="cart.html"
                   class="hover:text-yellow-300">
                    🛒 Cart
                </a>

            </div>

        </div>

    </nav>


    <!-- Login Section -->
    <section class="min-h-[calc(100vh-80px)]
                    flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-md">

            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8">

                <div class="text-center mb-8">

                    <div class="text-6xl mb-4">
                        📚
                    </div>

                    <h1 class="text-3xl font-bold text-gray-900">
                        Welcome Back
                    </h1>

                    <p class="text-gray-500 mt-2">
                        Login to your BookNest account
                    </p>

                </div>


                <!-- Login Form -->
                <form onsubmit="loginUser(event)">

                    <!-- Email -->
                    <div class="mb-5">

                        <label class="block font-semibold mb-2">
                            Email Address
                        </label>

                        <input
                            id="email"
                            type="email"
                            required
                            placeholder="Enter your email"
                            class="w-full px-4 py-3 border border-gray-300
                                   rounded-lg focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500"
                        >

                    </div>


                    <!-- Password -->
                    <div class="mb-5">

                        <div class="flex justify-between mb-2">

                            <label class="font-semibold">
                                Password
                            </label>

                            <a href="#"
                               class="text-indigo-600 text-sm
                                      hover:underline">
                                Forgot Password?
                            </a>

                        </div>

                        <input
                            id="password"
                            type="password"
                            required
                            placeholder="Enter your password"
                            class="w-full px-4 py-3 border border-gray-300
                                   rounded-lg focus:outline-none
                                   focus:ring-2 focus:ring-indigo-500"
                        >

                    </div>


                    <!-- Remember Me -->
                    <div class="flex items-center mb-6">

                        <input
                            type="checkbox"
                            id="remember"
                            class="w-4 h-4 text-indigo-600"
                        >

                        <label for="remember"
                               class="ml-2 text-gray-600">
                            Remember me
                        </label>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="w-full bg-indigo-600 text-white
                               py-3 rounded-lg font-bold text-lg
                               hover:bg-indigo-800 transition">

                        Login

                    </button>

                </form>


                <!-- Message -->
                <div id="loginMessage"
                     class="hidden mt-5 p-4 rounded-lg
                            text-center">
                </div>


                <!-- Register -->
                <div class="text-center mt-7">

                    <p class="text-gray-600">
                        Don't have an account?
                        <a href="#"
                           onclick="showRegister()"
                           class="text-indigo-600 font-semibold
                                  hover:underline">
                            Create Account
                        </a>
                    </p>

                </div>

            </div>


            <!-- Back to Home -->
            <div class="text-center mt-6">

                <a href="index.html"
                   class="text-indigo-600 hover:underline">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-5 text-center">

        <p class="text-gray-400">
            © 2026 BookNest. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script>

        function loginUser(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("loginMessage");


            if (email && password) {

                message.className =
                    "mt-5 p-4 rounded-lg text-center " +
                    "bg-green-100 text-green-700";

                message.textContent =
                    "✅ Login successful! Redirecting...";

                message.classList.remove("hidden");


                localStorage.setItem(
                    "loggedIn",
                    "true"
                );


                setTimeout(function() {

                    window.location.href =
                        "books.html";

                }, 1200);

            }

        }


        function showRegister() {

            alert(
                "Registration page can be added next."
            );

        }

    </script>

</body>
</html>
